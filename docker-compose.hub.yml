services:
  backend:
    image: thien505/mern-backend:1.0
    network_mode: host
    environment:
      MONGODB_URI: ${MONGODB_URI}

  frontend:
    image: thien505/mern-frontend:2.0
    ports:
      - "5173:5173"
    depends_on:
      - backend
    extra_hosts:
      - "backend:host-gateway"
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge