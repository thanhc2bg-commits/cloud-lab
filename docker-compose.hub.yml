services:
  backend:
    image: thien505/mern-backend:1.0
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: ${MONGODB_URI}
    networks:
      - mern-network

  frontend:
    image: thien505/mern-frontend:1.0
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge
